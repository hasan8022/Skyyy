name: Build Skywell ET5 (2023) Tesla V12 Launcher APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android 9 & 12 GMS-Free Tesla APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract ZIP if Uploaded Directly to GitHub
        run: |
          if [ ! -f "settings.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "ZIP dosyasi bulundu ($ZIP_FILE), otomatik aciliyor..."
              unzip -o "$ZIP_FILE" -d .
            fi
            SUB_SETTINGS=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)
            if [ -n "$SUB_SETTINGS" ] && [ "$SUB_SETTINGS" != "./settings.gradle" ]; then
              SUB_DIR=$(dirname "$SUB_SETTINGS")
              cp -rn "$SUB_DIR"/* . || true
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 28 - 34)
        uses: android-actions/setup-android@v3

      - name: Ensure Android Debug Keystore Exists (V1 + V2 Signing for Android 9 & 12)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Debug & Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/*.apk dist-apk/Skywell_ET5_2023_Tesla_V12_Debug.apk || true
          cp app/build/outputs/apk/release/*.apk dist-apk/Skywell_ET5_2023_Tesla_V12_Release.apk || true
          ls -lh dist-apk/

      - name: Upload Compiled APKs (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Skywell-ET5-2023-Tesla-V12-Launcher-APK
          path: |
            dist-apk/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
